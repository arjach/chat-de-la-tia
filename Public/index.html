<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<meta name="theme-color" content="#0b0b0b">
<title>Gente Rota</title>
<style>
  :root {
    --bg: #0b0b0b; --panel: #151515; --panel2: #1e1e1e; --border: #2a2a2a;
    --text: #f2f2f2; --muted: #9a9a9a; --accent: #ffd400; --accent-text: #0b0b0b;
    --bubble: #222; --mention: #3a3200; --ink: #ffd400;
  }
  [data-theme="light"] {
    --bg: #fbf7e6; --panel: #ffffff; --panel2: #fff6c7; --border: #e6dca8;
    --text: #141414; --muted: #6b6b6b; --accent: #ffd400; --accent-text: #0b0b0b;
    --bubble: #ffffff; --mention: #fff0a0; --ink: #8a6a00;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100dvh; }
  input, button { font: inherit; color: inherit; }
  button { cursor: pointer; }

  /* ---------- Banner ---------- */
  header { background: #0b0b0b; border-bottom: 3px solid var(--accent); padding: 10px 14px; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .brand { flex: 1; min-width: 0; }
  .brand h1 { margin: 0; font-size: 22px; letter-spacing: .04em; color: var(--accent); font-weight: 900; text-transform: uppercase; line-height: 1.1; }
  .brand p { margin: 2px 0 0; font-size: 13px; color: #cfcfcf; font-style: italic; }
  .brand small { color: #777; font-size: 11px; }
  .hbtn { background: transparent; border: 1px solid #444; color: var(--accent); border-radius: 8px; width: 38px; height: 38px; font-size: 18px; flex-shrink: 0; }
  .hbtn:hover { border-color: var(--accent); }

  /* ---------- Login ---------- */
  #login { flex: 1; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .card { background: var(--panel); border: 1px solid var(--border); padding: 28px; border-radius: 14px; width: 100%; max-width: 360px; }
  .card h2 { margin: 0 0 6px; font-size: 20px; }
  .card .sub { margin: 0 0 16px; color: var(--muted); font-size: 14px; }
  .field { width: 100%; padding: 12px; background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; outline: none; }
  .field:focus { border-color: var(--accent); }
  .primary { background: var(--accent); color: var(--accent-text); border: 0; border-radius: 8px; padding: 12px 16px; font-weight: 700; }
  .primary:hover { filter: brightness(1.08); }
  #err { color: #ff6b6b; font-size: 14px; min-height: 20px; margin: 8px 0; }

  /* ---------- App ---------- */
  #app { flex: 1; display: none; grid-template-columns: 230px 1fr; min-height: 0; }
  #sidebar { background: var(--panel); border-right: 1px solid var(--border); overflow-y: auto; }
  #sidebar h3 { font-size: 11px; text-transform: uppercase; color: var(--muted); margin: 14px 12px 6px; letter-spacing: .08em; }
  .item { padding: 9px 12px; display: flex; align-items: center; gap: 8px; border-left: 3px solid transparent; white-space: nowrap; }
  .item:hover { background: var(--panel2); }
  .item.active { background: var(--panel2); border-left-color: var(--accent); font-weight: 700; }
  .item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #3ddc84; flex-shrink: 0; }
  .dot.off { background: #666; }
  .badge { background: var(--accent); color: var(--accent-text); border-radius: 10px; font-size: 11px; font-weight: 800; padding: 1px 7px; }
  .typing-ico { color: var(--ink); font-size: 12px; }
  .me-row { padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 13px; color: var(--muted); }
  .me-row b { color: var(--ink); }

  #main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #title { padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--border); font-weight: 700; display: flex; justify-content: space-between; gap: 10px; }
  #title span:last-child { color: var(--muted); font-weight: 400; font-size: 13px; }
  #messages { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 6px; }
  .msg { max-width: 78%; align-self: flex-start; }
  .msg .bubble { padding: 8px 12px; border-radius: 12px; background: var(--bubble); border: 1px solid var(--border); overflow-wrap: anywhere; white-space: pre-wrap; }
  .msg.me { align-self: flex-end; }
  .msg.me .bubble { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .msg.mention .bubble { background: var(--mention); border-color: var(--accent); }
  .msg .meta { font-size: 11px; color: var(--muted); margin: 0 4px 2px; display: flex; gap: 6px; }
  .msg.me .meta { justify-content: flex-end; }
  .msg .who { font-weight: 700; }
  .msg a { color: inherit; text-decoration: underline; }
  .msg.big .bubble { font-size: 34px; background: transparent; border: 0; padding: 0 4px; }
  .sys { align-self: center; font-size: 12px; color: var(--muted); padding: 2px 10px; border: 1px dashed var(--border); border-radius: 10px; }
  #typing { min-height: 20px; padding: 0 16px; font-size: 12px; color: var(--ink); font-style: italic; }

  #msgForm { display: flex; gap: 8px; padding: 10px; background: var(--panel); border-top: 1px solid var(--border); position: relative; }
  #msgForm .field { flex: 1; min-width: 0; }
  #emojiBtn { background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; width: 44px; font-size: 20px; flex-shrink: 0; }
  #emojiPanel { display: none; position: absolute; bottom: 62px; left: 10px; background: var(--panel); border: 1px solid var(--accent); border-radius: 12px; padding: 8px; grid-template-columns: repeat(8, 1fr); gap: 2px; z-index: 10; box-shadow: 0 6px 24px #0008; }
  #emojiPanel.open { display: grid; }
  #emojiPanel button { background: none; border: 0; font-size: 22px; padding: 4px; border-radius: 6px; }
  #emojiPanel button:hover { background: var(--panel2); }

  @media (max-width: 640px) {
    header { padding: 8px 10px; }
    .brand h1 { font-size: 18px; }
    .brand p { font-size: 11px; }
    .brand small { display: none; }
    #app { grid-template-columns: 112px 1fr; }
    #sidebar h3 { margin: 10px 8px 4px; font-size: 10px; }
    .item { padding: 8px; font-size: 13px; gap: 5px; }
    .me-row { padding: 8px; font-size: 12px; }
    .msg { max-width: 90%; }
    #messages { padding: 10px; }
    #title { padding: 10px 12px; }
    #title span:last-child { display: none; }
    #emojiPanel { grid-template-columns: repeat(7, 1fr); left: 6px; right: 6px; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>Gente Rota</h1>
    <p>Lo que quedó después del trauma</p>
    <small>genterota.com.ar</small>
  </div>
  <button class="hbtn" id="soundBtn" title="Sonido">🔔</button>
  <button class="hbtn" id="themeBtn" title="Modo claro / oscuro">☀️</button>
</header>

<div id="login">
  <form class="card" id="loginForm">
    <h2>Entrar</h2>
    <p class="sub">Sin registro. Elegí un apodo y listo.</p>
    <input class="field" id="nick" maxlength="20" placeholder="Tu apodo" autocomplete="off" autofocus>
    <div id="err"></div>
    <button class="primary" style="width:100%">Entrar al chat</button>
  </form>
</div>

<div id="app">
  <aside id="sidebar">
    <div class="me-row">Sos <b id="meName"></b></div>
    <h3>Sala</h3>
    <div class="item" data-chat="__general__"><span class="name"># General</span><span class="badge" hidden></span></div>
    <h3>Conectados (<span id="count">0</span>)</h3>
    <div id="userList"></div>
    <div id="offList"></div>
  </aside>
  <section id="main">
    <div id="title"><span id="titleText"># General</span><span id="titleSub"></span></div>
    <div id="messages"></div>
    <div id="typing"></div>
    <form id="msgForm" autocomplete="off">
      <button type="button" id="emojiBtn">😊</button>
      <div id="emojiPanel"></div>
      <input class="field" id="text" maxlength="500" placeholder="Escribí un mensaje…">
      <button class="primary">Enviar</button>
    </form>
  </section>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const GENERAL = "__general__";
const $ = (id) => document.getElementById(id);

let me = "";
let current = GENERAL;
let online = [];
const history = { [GENERAL]: [] };
const unread = {};
const typingNow = {};            // chat -> Set de apodos escribiendo
let totalUnread = 0;

// ---------- Preferencias (tema y sonido) ----------
const store = {
  get(k, d) { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} }
};
let theme = store.get("gr-theme", "dark");
let sound = store.get("gr-sound", "on") === "on";
function applyPrefs() {
  document.documentElement.dataset.theme = theme;
  $("themeBtn").textContent = theme === "dark" ? "☀️" : "🌙";
  $("soundBtn").textContent = sound ? "🔔" : "🔕";
}
applyPrefs();
$("themeBtn").onclick = () => { theme = theme === "dark" ? "light" : "dark"; store.set("gr-theme", theme); applyPrefs(); };
$("soundBtn").onclick = () => { sound = !sound; store.set("gr-sound", sound ? "on" : "off"); applyPrefs(); if (sound) beep(); };

// ---------- Sonido (sin archivos) ----------
let audioCtx;
function beep(freq = 880) {
  if (!sound) return;
  try {
    audioCtx ||= new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = freq; o.type = "sine";
    g.gain.setValueAtTime(0.15, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
    o.connect(g).connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + 0.25);
  } catch {}
}

// ---------- Notificaciones del navegador ----------
function notify(title, body) {
  if (!document.hidden || !("Notification" in window) || Notification.permission !== "granted") return;
  try { new Notification(title, { body }); } catch {}
}

// ---------- Utilidades ----------
const hhmm = (ts) => new Date(ts).toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" });
function nickColor(n) {
  let h = 0; for (const c of n.toLowerCase()) h = (h * 31 + c.charCodeAt(0)) % 360;
  return `hsl(${h}, 75%, ${theme === "dark" ? 65 : 38}%)`;
}
const onlyEmoji = (t) => /^(\p{Extended_Pictographic}|\p{Emoji_Component}|‍|️|\s){1,12}$/u.test(t) && /\p{Extended_Pictographic}/u.test(t);
function linkify(el, text) {
  const re = /(https?:\/\/[^\s]+)/g; let last = 0, m;
  while ((m = re.exec(text))) {
    el.append(text.slice(last, m.index));
    const a = document.createElement("a");
    a.href = m[0]; a.textContent = m[0]; a.target = "_blank"; a.rel = "noopener noreferrer";
    el.append(a); last = m.index + m[0].length;
  }
  el.append(text.slice(last));
}
function updateTitle() {
  totalUnread = Object.values(unread).reduce((a, b) => a + (b || 0), 0);
  document.title = totalUnread ? `(${totalUnread}) Gente Rota` : "Gente Rota";
}

// ---------- Login ----------
function join(nick, onFail) {
  socket.emit("join", nick, (res) => {
    if (!res.ok) return onFail && onFail(res.error);
    me = res.nick; online = res.users;
    $("meName").textContent = me;
    $("login").style.display = "none";
    $("app").style.display = "grid";
    renderUsers(); renderMessages();
  });
}
$("loginForm").addEventListener("submit", (e) => {
  e.preventDefault();
  if ("Notification" in window && Notification.permission === "default") Notification.requestPermission();
  beep(0); // desbloquea el audio en celulares
  join($("nick").value, (err) => $("err").textContent = err);
});

// Reconexión automática: vuelve a entrar con el mismo apodo
socket.on("connect", () => {
  if (!me) return;
  join(me, () => push(GENERAL, { type: "sys", text: "No se pudo recuperar tu apodo. Recargá la página." }));
  push(GENERAL, { type: "sys", text: "Reconectado ✔" });
});
socket.on("disconnect", () => { if (me) push(GENERAL, { type: "sys", text: "Conexión perdida… reconectando" }); });

// ---------- Render ----------
function sideItem(chat, label, isOnline) {
  const div = document.createElement("div");
  div.className = "item" + (current === chat ? " active" : "");
  div.dataset.chat = chat;
  if (chat !== GENERAL) { const d = document.createElement("span"); d.className = "dot" + (isOnline ? "" : " off"); div.append(d); }
  const name = document.createElement("span"); name.className = "name"; name.textContent = label;
  if (chat !== GENERAL) name.style.color = nickColor(chat);
  div.append(name);
  if (typingNow[chat]?.size) { const t = document.createElement("span"); t.className = "typing-ico"; t.textContent = "✎"; div.append(t); }
  if (unread[chat]) { const b = document.createElement("span"); b.className = "badge"; b.textContent = unread[chat]; div.append(b); }
  return div;
}
function renderUsers() {
  const gen = document.querySelector('#sidebar > [data-chat="__general__"]');
  gen.replaceWith(sideItem(GENERAL, "# General"));
  const others = online.filter((u) => u !== me);
  $("count").textContent = online.length;
  $("userList").replaceChildren(...others.map((u) => sideItem(u, u, true)));
  // chats privados abiertos con gente que ya se fue
  const gone = Object.keys(history).filter((c) => c !== GENERAL && !online.includes(c));
  $("offList").replaceChildren(...gone.map((u) => sideItem(u, u, false)));
  updateTitle();
}

function renderMessages() {
  const box = $("messages");
  box.replaceChildren();
  (history[current] || []).forEach((m) => {
    if (m.type === "sys") {
      const d = document.createElement("div"); d.className = "sys"; d.textContent = m.text; box.append(d); return;
    }
    const mine = m.from === me;
    const mention = !mine && me && new RegExp("@" + me.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\b", "i").test(m.text);
    const d = document.createElement("div");
    d.className = "msg" + (mine ? " me" : "") + (mention ? " mention" : "") + (onlyEmoji(m.text) ? " big" : "");
    const meta = document.createElement("div"); meta.className = "meta";
    if (!mine && current === GENERAL) {
      const w = document.createElement("span"); w.className = "who"; w.textContent = m.from; w.style.color = nickColor(m.from);
      meta.append(w);
    }
    const t = document.createElement("span"); t.textContent = hhmm(m.ts || Date.now()); meta.append(t);
    const b = document.createElement("div"); b.className = "bubble"; linkify(b, m.text);
    d.append(meta, b);
    box.append(d);
  });
  box.scrollTop = box.scrollHeight;
  $("titleText").textContent = current === GENERAL ? "# General" : "🔒 " + current;
  $("titleSub").textContent = current === GENERAL ? "Todos ven estos mensajes" : "Privado: solo ustedes dos";
  renderTyping();
}

function renderTyping() {
  const set = typingNow[current];
  const names = set ? [...set] : [];
  $("typing").textContent = !names.length ? "" :
    names.length === 1 ? `${names[0]} está escribiendo…` :
    names.length < 4 ? `${names.join(", ")} están escribiendo…` : "Varios están escribiendo…";
}

function push(chat, m) {
  (history[chat] ||= []).push(m);
  if (history[chat].length > 300) history[chat].shift();
  if (chat === current && !document.hidden) renderMessages();
  else {
    if (m.type !== "sys") unread[chat] = (unread[chat] || 0) + 1;
    if (chat === current) renderMessages();
  }
  renderUsers();
}

// ---------- Cambiar de chat ----------
$("sidebar").addEventListener("click", (e) => {
  const item = e.target.closest(".item"); if (!item) return;
  stopTyping();
  current = item.dataset.chat;
  unread[current] = 0;
  renderUsers(); renderMessages();
  $("text").placeholder = current === GENERAL ? "Escribí un mensaje…" : `Mensaje privado a ${current}…`;
  $("text").focus();
});
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && me) { unread[current] = 0; renderUsers(); renderMessages(); }
});

// ---------- Emojis ----------
const EMOJIS = "😀 😂 🤣 😊 😍 😘 😎 🤔 😐 😴 😢 😭 😡 🤯 🥲 🙃 🖤 💛 💔 ❤️‍🩹 🔥 ✨ 👍 👎 👏 🙏 🤝 💪 👀 🫂 🤗 😬 🥺 😅 🎉 ☕ 🍺 🌙 ⚡ 💀".split(" ");
$("emojiPanel").append(...EMOJIS.map((em) => {
  const b = document.createElement("button"); b.type = "button"; b.textContent = em;
  b.onclick = () => { const i = $("text"); const p = i.selectionStart ?? i.value.length;
    i.value = i.value.slice(0, p) + em + i.value.slice(p); i.focus(); i.setSelectionRange(p + em.length, p + em.length); };
  return b;
}));
$("emojiBtn").onclick = (e) => { e.stopPropagation(); $("emojiPanel").classList.toggle("open"); };
document.addEventListener("click", (e) => { if (!e.target.closest("#emojiPanel")) $("emojiPanel").classList.remove("open"); });

// ---------- Escribiendo… ----------
let typingTimer = null, typingSentTo = undefined;
function stopTyping() {
  if (typingSentTo !== undefined) socket.emit("typing", { to: typingSentTo, on: false });
  typingSentTo = undefined; clearTimeout(typingTimer);
}
$("text").addEventListener("input", () => {
  const to = current === GENERAL ? null : current;
  if (typingSentTo === undefined) { socket.emit("typing", { to, on: true }); typingSentTo = to; }
  clearTimeout(typingTimer);
  typingTimer = setTimeout(stopTyping, 2500);
});
socket.on("typing", ({ from, chat, on }) => {
  const s = (typingNow[chat] ||= new Set());
  on ? s.add(from) : s.delete(from);
  renderTyping(); renderUsers();
});

// ---------- Enviar ----------
$("msgForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const text = $("text").value.trim();
  if (!text) return;
  $("text").value = "";
  $("emojiPanel").classList.remove("open");
  stopTyping();
  if (current === GENERAL) socket.emit("public-message", text);
  else {
    const to = current;
    socket.emit("private-message", { to, text }, (res) => {
      if (res.ok) push(to, { from: me, text, ts: res.msg.ts });
      else push(to, { type: "sys", text: res.error });
    });
  }
});

// ---------- Eventos del servidor ----------
function clearTyping(from) { Object.values(typingNow).forEach((s) => s.delete(from)); }
socket.on("public-message", (m) => {
  clearTyping(m.from);
  push(GENERAL, m);
  if (m.from !== me) {
    const mention = new RegExp("@" + me.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\b", "i").test(m.text);
    if (mention) { beep(1200); notify(`${m.from} te mencionó`, m.text); }
    else if (current !== GENERAL || document.hidden) beep(660);
  }
});
socket.on("private-message", (m) => {
  clearTyping(m.from);
  push(m.from, { from: m.from, text: m.text, ts: m.ts });
  beep(990); notify(`Mensaje privado de ${m.from}`, m.text);
});
socket.on("users", (list) => { online = list; renderUsers(); });
socket.on("user-joined", (n) => push(GENERAL, { type: "sys", text: `${n} entró` }));
socket.on("user-left", (n) => {
  clearTyping(n);
  push(GENERAL, { type: "sys", text: `${n} salió` });
  if (history[n]) push(n, { type: "sys", text: `${n} se desconectó` });
});
</script>
</body>
</html>
